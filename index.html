
  <!DOCTYPE html>
  <html lang="de">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Mobile Status Bar Color - matches navigation background -->
      <meta name="theme-color" content="#161310" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-capable" content="yes" />

      <title>Barbershop — For Ladies & Gentlemen</title>

      <!-- Meta Tags -->
      <meta name="description" content="Modern barbershop SPA template. Classic barber craft for ladies and gentlemen. Built with React 18, TypeScript, and Tailwind CSS." />
      <meta name="keywords" content="Barbershop, SPA, React, Template, Booking, Tailwind" />
      <meta name="author" content="Artur Galstyan" />

      <!-- Open Graph / Facebook -->
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Barbershop — For Ladies & Gentlemen" />
      <meta property="og:description" content="Modern barbershop SPA template with booking system, service catalog, and dark luxury theme." />
      <meta property="og:image" content="" />

      <!-- Twitter -->
      <meta property="twitter:card" content="summary_large_image" />
      <meta property="twitter:title" content="Barbershop — For Ladies & Gentlemen" />
      <meta property="twitter:description" content="Modern barbershop SPA template with booking system, service catalog, and dark luxury theme." />

      <!-- Favicon -->
      <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />

      <!-- Performance: Preconnect to font origins -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <!-- Performance: Preload LCP image (hero logo) -->
      <link rel="preload" href="/src/assets/optimized/barbershop-logo.png" as="image" fetchpriority="high">

      <!-- Google Fonts - deferred loading for better performance -->
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

      <!-- Critical CSS - inline for faster FCP -->
      <style>
        /* Critical above-the-fold styles - renders immediately */
        body {
          margin: 0;
          padding: 0;
          background-color: #0D0C0A;
          color: #F5F1E8;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #root {
          min-height: 100vh;
        }
        /* Prevent layout shift with hero dimensions */
        .hero-placeholder {
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
      </style>
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
      <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=2" />
      <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png?v=2" />
      <link rel="manifest" href="/site.webmanifest" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
